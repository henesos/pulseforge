spring:
  application:
    name: control-plane
  datasource:
    url: jdbc:postgresql://localhost:5432/pulseforge
    username: pulseforge
    password: pulseforge
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must never touch it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

pulseforge:
  # Reported by /api/v1/system/status. Must match `version` in the root build.gradle.kts, which
  # stamps the jars — a service announcing a version its artifacts do not carry is worse than no
  # version at all.
  version: 0.2.0
  run:
    # Lead time so every worker has the command before the shared start instant arrives.
    dispatch-lead: 2s
    # Grace period for in-flight snapshots to reach ClickHouse after the last worker reports.
    settle-delay: 5s
    # How often active runs are checked for workers that stopped reporting.
    watchdog-interval: 5s
  nats:
    url: nats://localhost:4222
    connection-timeout: 5s
    reconnect-wait: 2s
  clickhouse:
    http-url: http://localhost:8123
    database: pulseforge
    username: pulseforge
    password: pulseforge
    timeout: 5s

logging:
  level:
    io.pulseforge: INFO

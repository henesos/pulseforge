# Single source of truth for every dependency version in the build.
[versions]
java = "21"
springBoot = "3.3.5"
springDependencyManagement = "1.1.6"
hdrHistogram = "2.2.2"
jnats = "2.20.4"
clickhouseJdbc = "0.6.5"
lz4 = "1.8.0"
testcontainers = "1.20.3"
protobuf = "3.25.5"
grpc = "1.68.1"
protobufPlugin = "0.9.4"

[libraries]
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrHistogram" }
jnats = { module = "io.nats:jnats", version.ref = "jnats" }
clickhouse-jdbc = { module = "com.clickhouse:clickhouse-jdbc", version.ref = "clickhouseJdbc" }
clickhouse-http-client = { module = "com.clickhouse:clickhouse-http-client", version.ref = "clickhouseJdbc" }
lz4-java = { module = "org.lz4:lz4-java", version.ref = "lz4" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
# Supplies the @Generated annotation the grpc-java code generator emits.
annotation-api = { module = "javax.annotation:javax.annotation-api", version = "1.3.2" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }

spring:
  application:
    name: load-worker
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

server:
  # Workers are scaled with `--scale`, so this port is never published to the host.
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

pulseforge:
  nats:
    url: nats://localhost:4222
    connection-timeout: 5s
    reconnect-wait: 2s
  worker:
    # id defaults to the container hostname
    heartbeat-interval: 2s
    # One snapshot per step per interval. Lower means finer-grained results and more bus traffic;
    # this is the knob that keeps message volume independent of request rate.
    snapshot-interval: 1s
    # Bounded on purpose: on overflow samples are dropped and counted, never allowed to block the
    # generator. Sized for ~1s of samples at a high rate.
    metric-queue-capacity: 65536
    max-concurrent-requests: 10000
    connect-timeout: 5s
    request-timeout: 30s
    # nats: publish/subscribe, no coupling to an ingestor address, no delivery acknowledgement.
    # grpc: direct client-streamed connection, one less hop, per-stream acknowledgement.
    metrics-transport: nats
    ingestor-grpc-target: metrics-ingestor:9090

logging:
  level:
    io.pulseforge: INFO

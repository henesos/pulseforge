spring:
  application:
    name: metrics-ingestor
  datasource:
    url: jdbc:clickhouse://localhost:8123/pulseforge
    username: pulseforge
    password: pulseforge
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    hikari:
      maximum-pool-size: 4
      connection-test-query: SELECT 1

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

pulseforge:
  nats:
    url: nats://localhost:4222
    connection-timeout: 5s
    reconnect-wait: 2s
  ingestor:
    batch-size: 500
    flush-interval: 2s
    queue-capacity: 10000
    # Both transports listen by default, so a fleet can be migrated one worker at a time
    # rather than in a flag day.
    nats-enabled: true
    grpc-enabled: true
    grpc-port: 9090

logging:
  level:
    io.pulseforge: INFO
